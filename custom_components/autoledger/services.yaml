add_refuel:
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: autoledger
    litres:
      selector:
        number:
          min: 0
          max: 200
          step: 0.01
          unit_of_measurement: L
          mode: box
    total:
      selector:
        number:
          min: 0
          max: 1000
          step: 0.01
          mode: box
    price_per_l:
      selector:
        number:
          min: 0
          max: 10
          step: 0.001
          mode: box
    odometer:
      selector:
        number:
          min: 0
          max: 2000000
          unit_of_measurement: km
          mode: box
    full_tank:
      default: true
      selector:
        boolean:
    station:
      selector:
        text:
    timestamp:
      selector:
        datetime:

add_charge:
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: autoledger
    energy_kwh:
      required: true
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          unit_of_measurement: kWh
          mode: box
    total:
      selector:
        number:
          min: 0
          max: 1000
          step: 0.01
          mode: box
    price_per_kwh:
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          mode: box
    location:
      selector:
        text:
    timestamp:
      selector:
        datetime:

add_odometer:
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: autoledger
    odometer:
      required: true
      selector:
        number:
          min: 0
          max: 2000000
          unit_of_measurement: km
          mode: box
    timestamp:
      selector:
        datetime:

resync:
