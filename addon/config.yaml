name: AutoLedger
version: "0.6.0"
slug: autoledger
description: Trip, charging, fuel, maintenance and cost bookkeeping for your cars
url: https://github.com/kramat/autoledger
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:car-cog
panel_title: AutoLedger
watchdog: http://[HOST]:[PORT:8099]/api/v1/health
discovery:
  - autoledger
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API for your own scripts (bearer token required). Leave empty to keep it internal.
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
