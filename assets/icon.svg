<svg xmlns="http://www.w3.org/2000/svg" viewBox="348 318 1237 1237" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f78d1"/>
      <stop offset="1" stop-color="#283f9e"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="1450" y2="0">
      <stop offset="0" stop-color="#d6f1ff"/>
      <stop offset="0.35" stop-color="#7fe3f5"/>
      <stop offset="0.55" stop-color="#bff3fb"/>
      <stop offset="0.8" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
